<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minicarrinho de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>🛒 Minicarrinho</h1>
        <p>Escolha seus produtos e monte seu carrinho.</p>

        <section class="produtos">
            <h2>Produtos</h2>

            <button class="btnProduto" data-nome="Maçã" data-preco="2.50">
                🍎 Maçã - R$ 2,50
            </button>

            <button class="btnProduto" data-nome="Banana" data-preco="1.80">
                🍌 Banana - R$ 1,80
            </button>

            <button class="btnProduto" data-nome="Laranja" data-preco="3.00">
                🍊 Laranja - R$ 3,00
            </button>

            <button class="btnProduto" data-nome="Uva" data-preco="6.50">
                🍇 Uva - R$ 6,50
            </button>
        </section>

        <section class="carrinho">
            <h2>Seu carrinho</h2>

            <ul id="listaCarrinho"></ul>

            <h3>Total: <span id="total">R$ 0,00</span></h3>

            <button id="btnEsvaziar">Esvaziar carrinho</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>



    <script src="script.js"></script>
</body>
</html>
